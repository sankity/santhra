[package]
name = "santhra-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "santhra-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
rune = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
app-core = { path = "../../crates/app-core" }
audio-linux = { path = "../../crates/audio-linux" }
caption-core = { path = "../../crates/caption-core" }
speech-sherpa = { path = "../../crates/speech-sherpa" }
santhra-models = { path = "../../crates/santhra-models" }
santhra-download = { path = "../../crates/santhra-download" }
